<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas com a Nutri</title>
</head>
<body>
    <center>
    <h1>Marque sua consulta:</h1>
    <form action="http://localhost:3000" method="post"><br><br>
        <input type="number" placeholder="Identificação" name="id" required><br><br>
        <input type="date" name="data" required><br><br>
        <input type="time" name="hora" required><br><br>
        <input type="text" placeholder="Nome Completo" name="nome" required><br><br>
        <input type="number" placeholder="Peso, em Kg" name="peso" step="0.1" required><br><br>
        <input type="number" placeholder="Altura, em metros" name="altura" step="0.01" required><br><br>
        <button type="reset">Limpar</button>
        <button type="submit">Marcar</button><br><br>
    </form>
    <form action="http://localhost:3000" method="get"><button type="submit">Mostrar Pacientes</button></form>
    </center> 
</body>
</html>
